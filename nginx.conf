server {
    listen 80;
    server_name _;

    # 1. Configuración del Frontend (Quasar / Vue)
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Magia del SPA: Si el archivo no existe, carga index.html
        try_files $uri $uri/ /index.html;
    }

    # 2. Configuración del Backend (Laravel API y Sanctum)
    # Intercepta cualquier URL que empiece con /api o /sanctum
    location ~ ^/(api|sanctum) {
        # Redirige el tráfico por la red interna de Docker hacia PHP-FPM
        fastcgi_pass backend:9000;

        include fastcgi_params;

        # Le decimos a PHP-FPM qué archivo de Laravel debe ejecutar
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    }
}